<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
Rohan's College - Attendance Scanner
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 12px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef3f8,
      #f8fafc
    );

  color: #1f2937;

}

.container {

  max-width: 560px;

  margin: auto;

}

.card {

  background: white;

  border-radius: 20px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow:
    0 6px 25px
    rgba(0,0,0,.10);

}

.logo {

  width: 115px;

  height: 115px;

  border-radius: 50%;

  object-fit: cover;

  display: block;

  margin: 0 auto 12px;

  border: 4px solid white;

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.20);

}

.college {

  text-align: center;

  font-size: 20px;

  font-weight: bold;

  line-height: 1.35;

}

.subtitle {

  text-align: center;

  margin-top: 6px;

  color: #666;

  font-size: 13px;

}

.device {

  text-align: center;

  margin-top: 7px;

  font-weight: bold;

}

label {

  display: block;

  font-weight: bold;

  margin-bottom: 7px;

}

input {

  width: 100%;

  padding: 13px;

  border:
    1px solid #ccc;

  border-radius: 10px;

  font-size: 19px;

  text-align: center;

  letter-spacing: 4px;

}

button {

  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 10px;

}

button:disabled {

  opacity: .55;

}

.verify {

  background: #198754;

  color: white;

}

.start {

  background: #0d6efd;

  color: white;

}

.stop {

  background: #dc3545;

  color: white;

}

#cameraBox {

  display: none;

}

#video {

  width: 100%;

  border-radius: 16px;

  background: #000;

  margin-top: 12px;

}

.status {

  margin-top: 12px;

  padding: 13px;

  border-radius: 10px;

  background: #eef2f7;

  white-space: pre-line;

  line-height: 1.45;

}

.status.error {

  background: #fdecec;

  color: #a40000;

}

.status.success {

  background: #eaf7ee;

  color: #146c2e;

}

.scan-count {

  text-align: center;

  font-weight: bold;

  margin-top: 10px;

}

.student-card {

  display: none;

}

.student-header {

  text-align: center;

  border-bottom:
    1px solid #eee;

  padding-bottom: 12px;

  margin-bottom: 10px;

}

.student-name {

  font-size: 23px;

  font-weight: bold;

}

.student-id {

  margin-top: 4px;

  color: #666;

  font-size: 13px;

}

.details {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

}

.detail {

  background: #f6f8fa;

  border-radius: 10px;

  padding: 10px;

}

.detail-label {

  font-size: 11px;

  color: #777;

}

.detail-value {

  font-size: 14px;

  font-weight: bold;

  margin-top: 3px;

  word-break: break-word;

}

.attendance-result {

  margin-top: 14px;

  padding: 15px;

  border-radius: 14px;

  background: #eef5ff;

  text-align: center;

}

.action {

  font-size: 22px;

  font-weight: bold;

}

.result-grid {

  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 8px;

  margin-top: 10px;

}

.result-item {

  background: white;

  border-radius: 9px;

  padding: 9px;

}

.result-label {

  font-size: 10px;

  color: #777;

}

.result-value {

  font-size: 14px;

  font-weight: bold;

  margin-top: 3px;

}

.ready {

  text-align: center;

  color: #198754;

  font-weight: bold;

  margin-top: 10px;

}

.small {

  text-align: center;

  color: #777;

  font-size: 12px;

  margin: 12px 0;

}

@media(max-width:450px) {

  .details {

    grid-template-columns:
      1fr;

  }

  .college {

    font-size: 18px;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="card">

    <img
      class="logo"
      src="https://drive.google.com/thumbnail?id=1RXMqu0Sa05-Kd1sDvlRnfhjxm8Yun_Av&sz=w400"
      alt="College Logo"
      onerror="this.style.display='none';"
    >

    <div class="college">
      ROHAN'S COLLEGE OF HOTEL MANAGEMENT
    </div>

    <div class="subtitle">
      Fast Attendance Scanner
    </div>

    <div class="device">
      Device:
      <span id="deviceDisplay"></span>
    </div>

  </div>


  <!-- LOGIN -->

  <div class="card" id="loginBox">

    <label>
      Enter 4-Digit Device PIN
    </label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"

      autocomplete="off"
      placeholder="••••"
    >

    <button
      id="verifyButton"
      class="verify"

      VERIFY DEVICE
    </button>

    <div
      id="loginStatus"
      class="status"

      Enter the device PIN and tap VERIFY DEVICE.
    </div>

  </div>


  <!-- CAMERA -->

  <div
    class="card"
    id="cameraBox"
  >

    <div
      id="cameraStatus"
      class="status success"
    >
      Device verified.
      Start the camera.
    </div>

    <button
      id="startButton"
      class="start"
    >
      START CAMERA
    </button>

    <button
      id="stopButton"
      class="stop"
    >
      STOP CAMERA
    </button>

    <video

    ></video>

    </div>

  <!-- STUDENT RESULT -->

  <div
    class="card student-card"
    id="studentCard"
  >

    <div class="student-header">

      <div
        class="student-name"
        id="studentName"
      >
      </div>

      <div
        class="student-id"
        id="studentId"
      >
      </div>

    </div>


    <div
      class="details"
      id="studentDetails"
    >
    </div>


    <div
      class="attendance-result"
    >

      <div
        class="action"
        id="attendanceAction"
      >
      </div>

      <div
        class="result-grid"
      >

        <div class="result-item">

          <div class="result-label">
            Date
          </div>

          <div
            class="result-value"
            id="resultDate"
          >
          </div>

        </div>


        <div class="result-item">

          <div class="result-label">
            IN
          </div>

          <div
            class="result-value"
            id="resultIn"
          >
          </div>

        </div>


        <div class="result-item">

          <div class="result-label">
            OUT
          </div>

          <div
            class="result-value"
            id="resultOut"
          >
          </div>

        </div>


        <div class="result-item">

          <div class="result-label">
            Duration
          </div>

          <div
            class="result-value"
            id="resultDuration"
          >
          </div>

        </div>


        <div class="result-item">

          <div class="result-label">
            Status
          </div>

          <div
            class="result-value"
            id="resultStatus"
          >
          </div>

        </div>


        <div class="result-item">

          <div class="result-label">
            Late
          </div>

          <div
            class="result-value"
            id="resultLate"
          >
          </div>

        </div>

      </div>

    </div>


    <div class="ready">
      ✓ Ready for next student
    </div>

  </div>


  <div class="small">
    Keep the camera running and move each student's QR code in front of the camera.
  </div>


</div>


<script>


/*******************************************************
 * CONFIGURATION
 *******************************************************/


const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzvzlkVSOaaFotUUKmViFxcAg7k0Vw2M1xiUhb-3d92-w7vIRp6o5IlHArpxkhO-rmpfw/exec";


const urlParams =
  new URLSearchParams(
    window.location.search
  );


const deviceId =
  String(
    urlParams.get("device") ||
    "SCAN001"
  )
  .trim()
  .toUpperCase();


/*******************************************************
 * VARIABLES
 *******************************************************/

let sessionToken = "";

let stream = null;

let scanning = false;

let detector = null;

let detecting = false;

let jsonpCounter = 0;

let scanCount = 0;

let processingStudents =
  new Set();

let recentScans =
  new Map();


/*******************************************************
 * INITIAL DISPLAY
 *******************************************************/

document
  .getElementById(
    "deviceDisplay"
  )
  .textContent =
    deviceId;


/*******************************************************
 * STATUS
 *******************************************************/

function showLoginStatus(
  message,
  error,
  success
) {

  const box =
    document.getElementById(
      "loginStatus"
    );


  box.textContent =
    message;


  box.className =
    "status" +

    (
      error
        ? " error"
        : ""
    ) +

    (
      success
        ? " success"
        : ""
    );

}


function showCameraStatus(
  message,
  error,
  success
) {

  const box =
    document.getElementById(
      "cameraStatus"
    );


  box.textContent =
    message;


  box.className =
    "status" +

    (
      error
        ? " error"
        : ""
    ) +

    (
      success
        ? " success"
        : ""
    );

}


/*******************************************************
 * JSONP API
 *******************************************************/

function callAppsScriptApi(
  params
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "attendanceCallback_" +
        Date.now() +
        "_" +
        (++jsonpCounter);


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                "Attendance server timed out."
              )
            );

          },
          12000
        );


      window[callbackName] =
        function(response) {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(
            timeout
          );

          cleanup();

          resolve(
            response
          );

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(
            timeout
          );

          cleanup();

          reject(
            new Error(
              "Unable to connect to attendance server."
            )
          );

        };


      function cleanup() {

        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      script.src =
        APPS_SCRIPT_URL +
        "?" +
        query.toString();


      document.body
        .appendChild(
          script
        );

    }
  );

}


/*******************************************************
 * VERIFY DEVICE
 *******************************************************/

async function verifyScannerDevice() {

  const button =
    document.getElementById(
      "verifyButton"
    );


  const pin =
    String(
      document.getElementById(
        "pin"
      ).value || ""
    ).trim();


  if (
    !/^\d{4}$/.test(pin)
  ) {

    showLoginStatus(
      "Please enter exactly 4 digits.",
      true,
      false
    );

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "VERIFYING...";


  showLoginStatus(
    "Connecting to attendance server...",
    false,
    false
  );


  try {

    const response =
      await callAppsScriptApi({

        api: "verify",

        device: deviceId,

        pin: pin

      });


    if (
      response &&
      response.success
    ) {

      sessionToken =
        response.token;


      document
        .getElementById(
          "loginBox"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "cameraBox"
        )
        .style.display =
          "block";


      showCameraStatus(
        "DEVICE VERIFIED.\n\nTap START CAMERA.",
        false,
        true
      );


    } else {

      showLoginStatus(

        response &&
        response.message
          ? response.message
          : "Verification failed.",

        true,

        false

      );

    }


  } catch (error) {

    showLoginStatus(

      "Server connection error.\n\n" +
      error.message,

      true,

      false

    );

  }


  button.disabled =
    false;


  button.textContent =
    "VERIFY DEVICE";

}


/*******************************************************
 * ENTER PIN
 *******************************************************/

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        verifyScannerDevice();

      }

    }
  );


document
  .getElementById(
    "verifyButton"
  )
  .addEventListener(
    "click",
    verifyScannerDevice
  );


/*******************************************************
 * START CAMERA
 *******************************************************/

async function startCamera() {

  if (!sessionToken) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showCameraStatus(
      "Camera is not supported in this browser.",
      true,
      false
    );

    return;

  }


  if (
    !window.isSecureContext
  ) {

    showCameraStatus(
      "Please use the HTTPS GitHub Pages URL.",
      true,
      false
    );

    return;

  }


  if (
    !("BarcodeDetector" in window)
  ) {

    showCameraStatus(
      "QR scanning requires a recent Chrome browser.",
      true,
      false
    );

    return;

  }


  stopCamera(false);


  try {

    detector =
      new BarcodeDetector({

        formats: [
          "qr_code"
        ]

      });


    showCameraStatus(
      "Starting camera...",
      false,
      false
    );


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            /*
             * Lower resolution gives
             * faster QR detection.
             */

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    await video.play();


    scanning =
      true;


    showCameraStatus(
      "CAMERA ACTIVE.\n\nScan students continuously.",
      false,
      true
    );


    scanLoop();


  } catch (error) {

    console.error(
      error
    );


    stopCamera(false);


    showCameraStatus(

      "Unable to start camera.\n\n" +
      error.message,

      true,

      false

    );

  }

}


/*******************************************************
 * STOP CAMERA
 *******************************************************/

function stopCamera(
  showMessage
) {

  scanning =
    false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (video) {

    video.srcObject =
      null;

  }


  if (
    showMessage !== false
  ) {

    showCameraStatus(
      "Camera stopped.",
      false,
      false
    );

  }

}


/*******************************************************
 * BUTTONS
 *******************************************************/

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startCamera
  );


document
  .getElementById(
    "stopButton"
  )
  .addEventListener(
    "click",
    function() {

      stopCamera(
        true
      );

    }
  );


/*******************************************************
 * QR SCAN LOOP
 *******************************************************/

async function scanLoop() {

  if (!scanning) {

    return;

  }


  if (
    !detecting &&
    detector
  ) {

    const video =
      document.getElementById(
        "video"
      );


    if (
      video.readyState >= 2
    ) {

      detecting =
        true;


      try {

        const barcodes =
          await detector.detect(
            video
          );


        if (
          barcodes &&
          barcodes.length
        ) {

          const rawValue =
            barcodes[0]
              .rawValue;


          if (rawValue) {

            processQr(
              rawValue
            );

          }

        }


      } catch (error) {

        console.log(
          "QR detection:",
          error
        );

      }


      detecting =
        false;

    }

  }


  if (scanning) {

    setTimeout(
      function() {

        requestAnimationFrame(
          scanLoop
        );

      },
      70
    );

  }

}


/*******************************************************
 * PROCESS QR
 *******************************************************/

function processQr(
  rawValue
) {

  const studentId =
    extractStudentId(
      rawValue
    );


  if (!studentId) {

    return;

  }


  const now =
    Date.now();


  /*
   * Same student cooldown:
   * prevents accidental duplicate
   * scans while QR remains in camera.
   */

  const previous =
    recentScans.get(
      studentId
    );


  if (
    previous &&
    now - previous < 1800
  ) {

    return;

  }


  /*
   * Prevent same student from
   * being sent twice simultaneously.
   */

  if (
    processingStudents.has(
      studentId
    )
  ) {

    return;

  }


  recentScans.set(
    studentId,
    now
  );


  processingStudents.add(
    studentId
  );


  showCameraStatus(
    "QR DETECTED\n\nStudent ID: " +
    studentId +
    "\n\nRecording attendance...",
    false,
    false
  );


  recordAttendance(
    studentId
  )

  .finally(
    function() {

      processingStudents.delete(
        studentId
      );

    }
  );

}


/*******************************************************
 * RECORD ATTENDANCE
 *******************************************************/

async function recordAttendance(
  studentId
) {

  try {

    const response =
      await callAppsScriptApi({

        api: "record",

        student:
          studentId,

        token:
          sessionToken

      });


    if (
      response &&
      response.success
    ) {

      scanCount++;


      document
        .getElementById(
          "scanCount"
        )
        .textContent =
          "Scanned: " +
          scanCount;


      showStudentResult(
        response
      );


      showCameraStatus(

        response.message ||
        "Attendance recorded.",

        false,

        true

      );


    } else {

      showCameraStatus(

        response &&
        response.message
          ? response.message
          : "Attendance failed.",

        true,

        false

      );

    }


  } catch (error) {

    showCameraStatus(

      "Attendance server error.\n\n" +
      error.message,

      true,

      false

    );

  }

}


/*******************************************************
 * SHOW STUDENT RESULT
 *******************************************************/

function showStudentResult(
  response
) {

  const student =
    response.student;


  const attendance =
    response.attendance;


  if (!student) {

    return;

  }


  const card =
    document.getElementById(
      "studentCard"
    );


  card.style.display =
    "block";


  document
    .getElementById(
      "studentName"
    )
    .textContent =
      student.name ||
      "-";


  document
    .getElementById(
      "studentId"
    )
    .textContent =
      "Student ID: " +
      (
        student.studentId ||
        "-"
      );


  const details =
    document.getElementById(
      "studentDetails"
    );


  details.innerHTML =

    detail(
      "Course",
      student.course
    ) +

    detail(
      "Year",
      student.year
    ) +

    detail(
      "Batch",
      student.batch
    ) +

    detail(
      "Mobile",
      student.mobile
    ) +

    detail(
      "Parent / Guardian",
      student.parentName
    ) +

    detail(
      "Parent Mobile",
      student.parentMobile
    ) +

    detail(
      "DOB",
      student.dob
    ) +

    detail(
      "Gender",
      student.gender
    ) +

    detail(
      "Status",
      student.status
    );


  document
    .getElementById(
      "attendanceAction"
    )
    .textContent =
      actionText(
        response.action
      );


  document
    .getElementById(
      "resultDate"
    )
    .textContent =
      attendance.date ||
      "-";


  document
    .getElementById(
      "resultIn"
    )
    .textContent =
      attendance.inTime ||
      "-";


  document
    .getElementById(
      "resultOut"
    )
    .textContent =
      attendance.outTime ||
      "-";


  document
    .getElementById(
      "resultDuration"
    )
    .textContent =
      attendance.duration ||
      "-";


  document
    .getElementById(
      "resultStatus"
    )
    .textContent =
      attendance.status ||
      "-";


  document
    .getElementById(
      "resultLate"
    )
    .textContent =
      attendance.late ||
      "No";


  /*
   * Keep latest result visible,
   * while camera continues running.
   */

  card.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

}


/*******************************************************
 * DETAIL HTML
 *******************************************************/

function detail(
  label,
  value
) {

  return `

    <div class="detail">

      <div class="detail-label">
        ${escapeHtml(label)}
      </div>

      <div class="detail-value">
        ${escapeHtml(
          value || "-"
        )}
      </div>

    </div>

  `;

}


/*******************************************************
 * ACTION TEXT
 *******************************************************/

function actionText(
  action
) {

  if (
    action === "IN"
  ) {

    return "✓ IN RECORDED";

  }


  if (
    action === "OUT"
  ) {

    return "✓ OUT RECORDED";

  }


  if (
    action === "NO_CHANGE"
  ) {

    return "✓ ALREADY COMPLETED";

  }


  return "✓ ATTENDANCE UPDATED";

}


/*******************************************************
 * EXTRACT STUDENT ID
 *******************************************************/

function extractStudentId(
  rawValue
) {

  const value =
    String(
      rawValue || ""
    ).trim();


  /*
   * Existing profile URL
   */

  try {

    const url =
      new URL(
        value
      );


    const id =
      url.searchParams.get(
        "id"
      );


    if (id) {

      return id
        .trim()
        .toUpperCase();

    }

  } catch (error) {}


  /*
   * RC########
   */

  const match =
    value.match(
      /RC\d{8}/i
    );


  if (match) {

    return match[0]
      .toUpperCase();

  }


  return "";

}


/*******************************************************
 * HTML ESCAPE
 *******************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
